
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor's Dump</title>

<style>
:root {
  --cream: #F3E4C6;
  --olive: #59633C;
  --blue: #2457C5;
  --terracotta: #C94B36;
  --red: #873B32;
  --brown: #674334;
  --background: #FAF7EF;
  --ink: #39332e;
  --muted: #887F72;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 55px 7%;
  background: var(--background);
  color: var(--ink);
  font-family: Georgia, serif;
  font-size: 15px;
  line-height: 1.7;
}

header {
  max-width: 1100px;
  margin: 0 auto 38px;
}

h1 {
  font-size: 30px;
  font-weight: normal;
  letter-spacing: -0.5px;
  margin: 0;
}

.intro {
  color: var(--muted);
  font-size: 14px;
  margin-top: 4px;
}

.layout {
  display: grid;
  grid-template-columns: 145px minmax(0, 1fr);
  gap: 42px;
  max-width: 1100px;
  margin: 0 auto;
  align-items: start;
}

nav {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 9px;
  position: sticky;
  top: 30px;
}

nav button {
  border: 0;
  background: none;
  padding: 0;
  text-align: left;
  cursor: pointer;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
}

nav button:hover { color: var(--terracotta); }

nav button.active {
  color: var(--brown);
  text-decoration: underline;
  text-decoration-color: var(--olive);
  text-underline-offset: 4px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 19px;
  align-items: start;
}

.note {
  padding: 22px 20px 18px;
  height: fit-content;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(80, 60, 40, 0.07);
  box-shadow: 0 3px 9px rgba(65, 56, 40, 0.07);
  transition: transform 180ms ease, box-shadow 180ms ease;
}

.note:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 15px rgba(65, 56, 40, 0.11);
}

.note:nth-child(6n + 1) {
  background: #F3E4C6;
  color: #674334;
}

.note:nth-child(6n + 2) {
  background: #2457C5;
  color: #FAF7EF;
}

.note:nth-child(6n + 3) {
  background: #87966B;
  color: #FAF7EF;
}

.note:nth-child(6n + 4) {
  background: #C94B36;
  color: #FAF7EF;
}

.note:nth-child(6n + 5) {
  background: #E6D2C1;
  color: #674334;
}

.note:nth-child(6n + 6) {
  background: #59633C;
  color: #FAF7EF;
}

.note h2 {
  font-size: 17px;
  line-height: 1.4;
  font-weight: normal;
  margin: 0 0 12px;
}

.note-image {
  display: block;
  width: 100%;
  max-height: 230px;
  object-fit: cover;
  border-radius: 3px;
  margin-bottom: 14px;
}

.note p {
  margin: 0 0 16px;
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.meta {
  font: 11px/1.6 Arial, sans-serif;
  margin-top: 8px;
  padding-top: 10px;
  overflow-wrap: anywhere;
}

.meta a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.topic-label {
  margin-bottom: 5px;
}

.note-links {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 7px;
}

.note-links a {
  overflow-wrap: anywhere;
}

.empty {
  color: var(--muted);
  font-size: 14px;
}

@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .layout {
    gap: 28px;
    grid-template-columns: 125px minmax(0, 1fr);
  }
}

@media (max-width: 600px) {
  body { padding: 35px 22px; }

  .layout {
    grid-template-columns: 1fr;
    gap: 24px;
  }

  nav {
    position: static;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px 17px;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .note {
    padding: 17px 15px;
  }

  .note h2 { font-size: 16px; }
}

@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>Noor's Dump</h1>
  <div class="intro">a small collection of things i want to remember</div>
</header>

<div class="layout">
  <nav id="topics">
    <button class="active" data-topic="all">all notes</button>
  </nav>

  <main id="notes" class="grid">
    <p class="empty">Loading notes...</p>
  </main>
</div>

<script>
const FEED_URL = "https://script.google.com/macros/s/AKfycbzPC4DfTjpkfD35cihU_WZSWFoBhLZ8rTBt-hsQQzteojCQGZ40d10xag4vBtL9Kb0C/exec";

let notes = [];
let selected = "all";

function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function getPhotoUrl(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";

  try {
    const url = new URL(raw);

    if (url.hostname !== "drive.google.com") return "";

    const id = url.searchParams.get("id") ||
      (url.pathname.match(/\/file\/d\/([^/]+)/) || [])[1];

    if (!id) return "";

    return "https://drive.google.com/uc?export=view&id=" +
      encodeURIComponent(id);
  } catch (error) {
    return "";
  }
}

function getLinks(value) {
  return String(value || "")
    .split(/\r?\n/)
    .map(link => link.trim())
    .filter(Boolean)
    .map(link => {
      try {
        const url = new URL(link);
        if (url.protocol !== "https:" && url.protocol !== "http:") {
          return null;
        }
        return url.href;
      } catch (error) {
        return null;
      }
    })
    .filter(Boolean);
}

function render() {
  const allTopics = [
    ...new Set(notes.flatMap(note => note.topics))
  ].sort();

  const topicNav = document.getElementById("topics");
  topicNav.replaceChildren();

  const allButton = makeElement(
    "button",
    selected === "all" ? "active" : "",
    "all notes"
  );

  allButton.dataset.topic = "all";
  topicNav.appendChild(allButton);

  allTopics.forEach(topic => {
    const button = makeElement(
      "button",
      selected === topic ? "active" : "",
      topic
    );

    button.dataset.topic = topic;
    topicNav.appendChild(button);
  });

  topicNav.querySelectorAll("button").forEach(button => {
    button.addEventListener("click", () => {
      selected = button.dataset.topic;
      render();
    });
  });

  const visible = selected === "all"
    ? notes
    : notes.filter(note => note.topics.includes(selected));

  const notesArea = document.getElementById("notes");
  notesArea.replaceChildren();

  if (visible.length === 0) {
    notesArea.appendChild(
      makeElement("p", "empty", "No notes in this topic yet.")
    );
    return;
  }

  visible.forEach(note => {
    const article = makeElement("article", "note");

    // Title
    if (note.title) {
      article.appendChild(makeElement("h2", "", note.title));
    }

    // Photo, directly below title
    if (note.photo) {
      const image = document.createElement("img");
      image.className = "note-image";
      image.src = note.photo;
      image.alt = note.title || "Note photo";
      image.loading = "lazy";

      image.addEventListener("error", () => {
        image.remove();
      });

      article.appendChild(image);
    }

    // Description
    if (note.description) {
      article.appendChild(
        makeElement("p", "", note.description)
      );
    }

    // Topics and date
    const meta = makeElement("div", "meta");

    const details = [...note.topics];

    if (note.date) details.push(note.date);

    meta.appendChild(
      makeElement("div", "topic-label", details.join(" · "))
    );

    // Multiple links
    if (note.links.length > 0) {
      const linkArea = makeElement("div", "note-links");

      note.links.forEach((url, index) => {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        try {
          link.textContent = new URL(url).hostname.replace(/^www\./, "");
        } catch (error) {
          link.textContent = "open link " + (index + 1);
        }

        linkArea.appendChild(link);
      });

      meta.appendChild(linkArea);
    }

    article.appendChild(meta);
    notesArea.appendChild(article);
  });
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString("en-US", {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

async function loadNotes() {
  const notesArea = document.getElementById("notes");

  try {
    const response = await fetch(FEED_URL);

    if (!response.ok) throw new Error("Could not load notes.");

    const rows = await response.json();

    notes = rows.map(row => ({
      title: String(row["Title"] || "").trim(),
      description: String(row["Description"] || row["Note"] || "").trim(),
      photo: getPhotoUrl(row["Photo"]),
      links: getLinks(row["Link"]),
      topics: String(row["topic"] || row["Topics"] || "")
        .split(",")
        .map(topic => topic.trim())
        .filter(Boolean),
      date: formatDate(row["Timestamp"]),
      sortDate: new Date(row["Timestamp"]).getTime() || 0
    }));

    notes.sort((a, b) => b.sortDate - a.sortDate);
    render();

  } catch (error) {
    notesArea.replaceChildren(
      makeElement(
        "p",
        "empty",
        "Couldn't load notes right now. Please try refreshing the page."
      )
    );
  }
}

loadNotes();
</script>

</body>
</html>
